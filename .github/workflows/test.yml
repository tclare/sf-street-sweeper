name: test

on:
  push:
  pull_request:
  schedule:
    - cron: "0 15 * * 1" # Mondays: catch SF Open Data API changes

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
